services:
  # ==========================================
  # Web Frontend (Only service exposed to Host)
  # ==========================================
  frontend:
    build: ./src/frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - AD_SERVICE_ADDR=adservice:9555
      - SHOPPING_ASSISTANT_SERVICE_ADDR=shoppingassistantservice:8080
      - DISABLE_PROFILER=1
      - ENV_PLATFORM=aws
    depends_on:
      - currencyservice
      - productcatalogservice
      - cartservice
      - recommendationservice
      - checkoutservice
      - shippingservice
      - adservice
    networks:
      - boutique-network

  # ==========================================
  # Cart Service & Redis Store
  # ==========================================
  cartservice:
    build: ./src/cartservice/src
    container_name: cartservice
    restart: unless-stopped
    environment:
      - ASPNETCORE_HTTP_PORTS=7070
      - REDIS_ADDR=redis-cart:6379
    depends_on:
      - redis-cart
    networks:
      - boutique-network

  redis-cart:
    image: redis:7-alpine
    container_name: redis-cart
    restart: unless-stopped
    networks:
      - boutique-network

  # ==========================================
  # Catalog & Business Logic Microservices
  # ==========================================
  productcatalogservice:
    build: ./src/productcatalogservice
    container_name: productcatalogservice
    restart: unless-stopped
    environment:
      - PORT=3550
      - DISABLE_PROFILER=1
    networks:
      - boutique-network

  currencyservice:
    build: ./src/currencyservice
    container_name: currencyservice
    restart: unless-stopped
    environment:
      - PORT=7000
      - DISABLE_PROFILER=1
    networks:
      - boutique-network

  paymentservice:
    build: ./src/paymentservice
    container_name: paymentservice
    restart: unless-stopped
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1
    networks:
      - boutique-network

  shippingservice:
    build: ./src/shippingservice
    container_name: shippingservice
    restart: unless-stopped
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1
    networks:
      - boutique-network

  emailservice:
    build: ./src/emailservice
    container_name: emailservice
    restart: unless-stopped
    environment:
      - PORT=8080
      - DISABLE_PROFILER=1
    networks:
      - boutique-network

  checkoutservice:
    build: ./src/checkoutservice
    container_name: checkoutservice
    restart: unless-stopped
    environment:
      - PORT=5050
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - PAYMENT_SERVICE_ADDR=paymentservice:50051
      - EMAIL_SERVICE_ADDR=emailservice:8080
      - DISABLE_PROFILER=1
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - shippingservice
      - paymentservice
      - emailservice
    networks:
      - boutique-network

  recommendationservice:
    build: ./src/recommendationservice
    container_name: recommendationservice
    restart: unless-stopped
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - DISABLE_PROFILER=1
    depends_on:
      - productcatalogservice
    networks:
      - boutique-network

  adservice:
    build: ./src/adservice
    container_name: adservice
    restart: unless-stopped
    environment:
      - PORT=9555
    networks:
      - boutique-network

  # ==========================================
  # Background Traffic Load Generator
  # ==========================================
  loadgenerator:
    build: ./src/loadgenerator
    container_name: loadgenerator
    restart: unless-stopped
    environment:
      - FRONTEND_ADDR=frontend:8080
      - USERS=10
      - RATE=1
    depends_on:
      - frontend
    networks:
      - boutique-network

networks:
  boutique-network:
    driver: bridge
