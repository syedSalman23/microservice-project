apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingassistantservice-deployment
  labels:
    app: shoppingassistantservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shoppingassistantservice
  template:
    metadata:
      labels:
        app: shoppingassistantservice
    spec:
      containers:
        - name: shoppingassistantservice-container
          image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/shoppingassistantservice:v0.10.7
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DISABLE_PROFILER
              value: "1"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          readinessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            tcpSocket:
              port: 8080
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 15
            tcpSocket:
              port: 8080
          resources:
            requests:
              memory: "180Mi"
              cpu: "100m"
            limits:
              memory: "300Mi"
              cpu: "300m"
---

apiVersion: v1
kind: Service
metadata:
  name: shoppingassistantservice
  labels:
    app: shoppingassistantservice
spec:
  type: ClusterIP
  selector:
    app: shoppingassistantservice
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
