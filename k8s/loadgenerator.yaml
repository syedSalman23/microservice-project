apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator-deployment
  labels:
    app: loadgenerator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgenerator
  template:
    metadata:
      labels:
        app: loadgenerator
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: loadgenerator-container
          image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/loadgenerator:v0.10.7
          env:
            - name: FRONTEND_ADDR
              value: "frontend:8080"
            - name: USERS
              value: "10"
            - name: RATE
              value: "1"
          resources:
            requests:
              memory: "180Mi"
              cpu: "100m"
            limits:
              memory: "300Mi"
              cpu: "300m"